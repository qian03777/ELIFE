<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#222222">
  <title>全國電子｜家電汰換服務系統</title>
  <style>
    :root{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#222;background:#f5f5f5;--pink:#e4007f;--navy:#222;--muted:#667685;--line:#dadada}*{box-sizing:border-box}body{margin:0;line-height:1.55}.system-bar{position:sticky;top:0;z-index:40;background:#222;color:#fff;box-shadow:0 4px 18px #2222}.system-bar-inner{width:min(1320px,calc(100% - 36px));height:70px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.system-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900;white-space:nowrap}.system-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--pink);color:#fff;font-size:22px}.system-brand small{display:block;color:#b8c2ca;font-size:11px;font-weight:650;letter-spacing:.09em}.system-nav{display:flex;align-items:center;gap:7px}.system-nav button{border:1px solid #ffffff36;border-radius:9px;padding:9px 13px;background:transparent;color:#e5e9ec;font-size:14px;font-weight:800;cursor:pointer}.system-nav button:hover,.system-nav button[aria-selected=true]{border-color:#f264aa;background:#e4007f;color:#fff}.system-badge{border:1px solid #ffffff36;border-radius:99px;padding:6px 9px;color:#ffd7e9;font-size:11px;font-weight:850;white-space:nowrap}.system-main{min-height:calc(100vh - 130px)}#appView{display:block}.loading-view{width:min(1320px,calc(100% - 36px));margin:30px auto;padding:20px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted)}customer-view,store-view{display:block}.system-footer{padding:16px 12px;border-top:1px solid var(--line);background:#fff;color:#81909b;text-align:center;font-size:12px}.view-error{width:min(1320px,calc(100% - 36px));margin:28px auto;padding:16px;border:1px solid #f0d2cc;border-radius:10px;background:#fff0ec;color:#8c382e}
    @media(max-width:620px){.system-bar-inner{width:calc(100% - 22px);height:auto;min-height:62px;flex-wrap:wrap;gap:8px;padding:9px 0}.system-brand{font-size:15px}.system-mark{width:34px;height:34px}.system-nav{order:3;width:100%;display:grid;grid-template-columns:1fr 1fr}.system-nav button{padding:8px 6px;font-size:13px}.system-badge{font-size:10px}.loading-view{width:calc(100% - 22px)}}
  </style>
</head>
<body>
  <header class="system-bar"><div class="system-bar-inner"><div class="system-brand"><span class="system-mark">全</span><span>全國電子<small>家電汰換服務系統</small></span></div><nav class="system-nav" aria-label="系統功能" role="tablist"><button type="button" role="tab" aria-selected="true" data-view="customer-view">顧客端試算</button><button type="button" role="tab" aria-selected="false" data-view="store-view">門市端管理</button></nav><span class="system-badge">網站原型</span></div></header>
  <main class="system-main"><div id="appView" aria-live="polite"><div class="loading-view">載入家電汰換服務系統…</div></div></main>
  <footer class="system-footer">前端原型｜估值、業績與營運建議包含模擬資料；不會送出申請或觸發撥款。</footer>
  <script src="national-electronics-tnkh.js"></script>
  <script src="official-service-rates.js"></script>
  <script src="demo-service-rates.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
